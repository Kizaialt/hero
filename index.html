<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Batch Watermark — Client-side</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:#0f1115; color:#eaeef4;
  }
  .wrap { max-width: 1100px; margin: 28px auto; padding: 0 16px; }
  .grid { display:grid; grid-template-columns: 340px 1fr; gap:16px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background:#141826; border:1px solid #222940; border-radius:14px; padding:16px;
  }
  h1 { margin: 0 0 10px; font-size: 22px; }
  h2 { margin: 0 0 10px; font-size: 16px; opacity:.9; }
  label { display:block; margin:10px 0 6px; font-size:12px; opacity:.9; }
  input[type="file"], select, input[type="number"], input[type="text"], input[type="range"] {
    width:100%; padding:10px; background:#0f1320; border:1px solid #2a3147; color:#eaeef4;
    border-radius:10px; outline:none;
  }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .btns { display:flex; gap:10px; flex-wrap: wrap; margin-top:12px; }
  button {
    background:#7c5cff; color:#fff; border:0; padding:10px 12px; border-radius:12px;
    font-weight:700; cursor:pointer;
  }
  button.secondary { background:#2a3350; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .note { font-size:12px; opacity:.8; margin-top:8px; line-height:1.35; }
  .gallery {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:12px;
  }
  .thumb {
    background:#0b0f1c; border:1px solid #222940; border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; aspect-ratio: 1 / 1;
    position: relative;
  }
  .thumb canvas, .thumb img { max-width:100%; max-height:100%; }
  .cap {
    position:absolute; left:8px; bottom:8px; font-size:11px; opacity:.85;
    background:rgba(0,0,0,.45); padding:5px 8px; border-radius:8px;
  }
  .bar { display:flex; gap:8px; align-items:center; }
  .bar input[type="range"] { width: 100%; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h1>Batch Watermark</h1>
        <div class="note">All processing happens locally in your browser. Nothing is uploaded.</div>

        <label>Photos (select multiple)</label>
        <input id="photos" type="file" accept="image/*" multiple />

        <label style="margin-top:12px;">Watermark image (PNG/SVG recommended, transparent)</label>
        <input id="wm" type="file" accept="image/*,.svg" />

        <div class="row" style="margin-top:6px;">
          <div>
            <label>Placement</label>
            <select id="pos">
              <option value="bottom-center">Bottom center</option>
              <option value="bottom-right">Bottom right</option>
              <option value="bottom-left">Bottom left</option>
              <option value="top-right">Top right</option>
              <option value="top-left">Top left</option>
              <option value="center">Center</option>
              <option value="tiled">Tiled (grid)</option>
            </select>
          </div>
          <div>
            <label>Scale (% of image width)</label>
            <input id="scale" type="number" min="2" max="80" value="22" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Opacity</label>
            <div class="bar">
              <input id="opacity" type="range" min="0" max="100" value="35" />
              <span id="opv" class="mono">35%</span>
            </div>
          </div>
          <div>
            <label>Padding (px)</label>
            <input id="pad" type="number" min="0" max="200" value="50" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Output: JPG quality</label>
            <input id="quality" type="number" min="0.6" max="1" step="0.05" value="0.92" />
          </div>
          <div>
            <label>Max side (px, 0 = original)</label>
            <input id="maxSide" type="number" min="0" max="8000" value="0" />
          </div>
        </div>

        <div class="btns">
          <button id="previewBtn" class="secondary" disabled>Preview</button>
          <button id="processBtn" disabled>Process All</button>
          <button id="zipBtn" class="secondary" disabled>Download ZIP</button>
          <button id="clearBtn" class="secondary">Clear</button>
        </div>

        <div class="note">
          Tips: For a subtle, professional look use opacity 25–40% and scale 18–24%. Tiled is useful when you must discourage re-use.
        </div>
      </div>

      <div class="card">
        <h2>Output preview</h2>
        <div id="gallery" class="gallery"></div>
        <div id="status" class="note"></div>
      </div>
    </div>
  </div>

  <!-- JSZip for ZIP downloads -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
(() => {
  const $ = sel => document.querySelector(sel);
  const photosEl = $('#photos');
  const wmEl = $('#wm');
  const posEl = $('#pos');
  const scaleEl = $('#scale');
  const opacityEl = $('#opacity');
  const padEl = $('#pad');
  const qualityEl = $('#quality');
  const maxSideEl = $('#maxSide');

  const previewBtn = $('#previewBtn');
  const processBtn = $('#processBtn');
  const zipBtn = $('#zipBtn');
  const clearBtn = $('#clearBtn');
  const gallery = $('#gallery');
  const statusEl = $('#status');
  const opv = $('#opv');

  let photoFiles = [];
  let watermarkImg = null;
  let results = []; // {name, blob}

  function reset() {
    photoFiles = [];
    watermarkImg = null;
    results = [];
    photosEl.value = "";
    wmEl.value = "";
    gallery.innerHTML = "";
    statusEl.textContent = "";
    previewBtn.disabled = true;
    processBtn.disabled = true;
    zipBtn.disabled = true;
  }

  clearBtn.addEventListener('click', reset);
  opacityEl.addEventListener('input', () => opv.textContent = opacityEl.value + '%');

  function fileToImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function drawCover(ctx, img, W, H) {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const ir = iw / ih, dr = W / H;
    let sx=0, sy=0, sw=iw, sh=ih;
    if (ir > dr) { // wider
      sh = ih; sw = ih * dr; sx = (iw - sw)/2; sy = 0;
    } else { // taller
      sw = iw; sh = iw / dr; sx = 0; sy = (ih - sh)/2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  }

  function maybeResize(img, maxSide) {
    if (!maxSide || maxSide <= 0) return {W: img.width, H: img.height};
    const s = Math.max(img.width, img.height);
    if (s <= maxSide) return {W: img.width, H: img.height};
    const r = maxSide / s;
    return {W: Math.round(img.width * r), H: Math.round(img.height * r)};
  }

  function placePoints(pos, W, H, wW, wH, pad) {
    // returns {x, y} top-left for single placement
    const map = {
      'bottom-center': {x: Math.round((W - wW)/2), y: H - wH - pad},
      'bottom-right':  {x: W - wW - pad, y: H - wH - pad},
      'bottom-left':   {x: pad, y: H - wH - pad},
      'top-right':     {x: W - wW - pad, y: pad},
      'top-left':      {x: pad, y: pad},
      'center':        {x: Math.round((W - wW)/2), y: Math.round((H - wH)/2)},
    };
    return map[pos] ?? map['bottom-center'];
  }

  function drawTiled(ctx, wm, W, H, cellW, cellH, opacity) {
    ctx.save();
    ctx.globalAlpha = opacity;
    const xStep = Math.max(1, Math.round(cellW * 1.25));
    const yStep = Math.max(1, Math.round(cellH * 1.25));
    for (let y = -cellH; y < H + cellH; y += yStep) {
      for (let x = -cellW; x < W + cellW; x += xStep) {
        ctx.drawImage(wm, x, y, cellW, cellH);
      }
    }
    ctx.restore();
  }

  async function renderOne(img, wm, opts) {
    const {position, scalePct, opacityPct, padding, quality, maxSide} = opts;

    const {W, H} = maybeResize(img, maxSide);
    const can = document.createElement('canvas');
    can.width = W; can.height = H;
    const ctx = can.getContext('2d');

    // Base image (fit/cover)
    drawCover(ctx, img, W, H);

    // Compute watermark size
    const wmScale = Math.max(0.01, Math.min(0.8, scalePct/100));
    const targetW = Math.round(W * wmScale);
    const ratio = (wm.width || wm.naturalWidth) / (wm.height || wm.naturalHeight);
    const targetH = Math.round(targetW / ratio);

    const opacity = Math.max(0, Math.min(1, opacityPct/100));

    if (position === 'tiled') {
      drawTiled(ctx, wm, W, H, targetW, targetH, opacity);
    } else {
      const pt = placePoints(position, W, H, targetW, targetH, padding);
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.drawImage(wm, pt.x, pt.y, targetW, targetH);
      ctx.restore();
    }

    return new Promise(resolve => {
      can.toBlob(b => resolve(b), 'image/jpeg', quality);
    });
  }

  function makeThumb(name, blobOrImg) {
    const box = document.createElement('div');
    box.className = 'thumb';
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = name;
    box.appendChild(cap);
    if (blobOrImg instanceof Blob) {
      const url = URL.createObjectURL(blobOrImg);
      const img = new Image();
      img.onload = () => URL.revokeObjectURL(url);
      img.src = url;
      box.appendChild(img);
    } else {
      // Image element preview
      box.appendChild(blobOrImg);
    }
    gallery.appendChild(box);
  }

  async function handlePreview() {
    gallery.innerHTML = "";
    statusEl.textContent = "";
    if (!photoFiles.length || !watermarkImg) return;

    // Show small previews (no processing) just to confirm selection
    for (const f of photoFiles.slice(0, 9)) {
      const img = await fileToImage(f);
      const ph = document.createElement('img');
      ph.src = URL.createObjectURL(f);
      makeThumb(f.name, ph);
    }
  }

  async function processAll() {
    if (!photoFiles.length || !watermarkImg) return;
    results = [];
    gallery.innerHTML = "";
    statusEl.textContent = "Processing...";

    const opts = {
      position: posEl.value,
      scalePct: Number(scaleEl.value),
      opacityPct: Number(opacityEl.value),
      padding: Number(padEl.value),
      quality: Math.max(0.6, Math.min(1, Number(qualityEl.value || 0.92))),
      maxSide: Number(maxSideEl.value || 0)
    };

    // Process sequentially to avoid memory spikes
    for (let i = 0; i < photoFiles.length; i++) {
      const f = photoFiles[i];
      try {
        const img = await fileToImage(f);
        const blob = await renderOne(img, watermarkImg, opts);
        const outName = f.name.replace(/\.(jpg|jpeg|png|webp|gif|bmp|tif|tiff)$/i, '') + '_wm.jpg';
        results.push({name: outName, blob});
        makeThumb(outName, blob);
        statusEl.textContent = `Processed ${i+1} / ${photoFiles.length}`;
      } catch (e) {
        console.error('Failed:', f.name, e);
      }
    }
    statusEl.textContent = `Done: ${results.length} file(s).`;
    zipBtn.disabled = results.length === 0;
  }

  async function downloadZip() {
    if (!results.length) return;
    const zip = new JSZip();
    const folder = zip.folder('watermarked') || zip;
    for (const r of results) {
      folder.file(r.name, r.blob);
    }
    statusEl.textContent = 'Zipping...';
    const blob = await zip.generateAsync({type: 'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dt = new Date();
    const ts = dt.toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `watermarked-${ts}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = 'ZIP ready.';
  }

  photosEl.addEventListener('change', (e) => {
    photoFiles = Array.from(e.target.files || []);
    previewBtn.disabled = !(photoFiles.length && watermarkImg);
    processBtn.disabled = !(photoFiles.length && watermarkImg);
  });

  wmEl.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) { watermarkImg = null; previewBtn.disabled = true; processBtn.disabled = true; return; }
    // load watermark image
    const img = await fileToImage(f);
    watermarkImg = img;
    previewBtn.disabled = !(photoFiles.length && watermarkImg);
    processBtn.disabled = !(photoFiles.length && watermarkImg);
  });

  previewBtn.addEventListener('click', handlePreview);
  processBtn.addEventListener('click', processAll);
  zipBtn.addEventListener('click', downloadZip);

  // Init
  reset();
})();
</script>
</body>
</html>
