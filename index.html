<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero Generator (1920×1080 → FB-safe)</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0f1115; color: #e7e7e7;
    }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
    .card {
      background: #151924; border: 1px solid #242a3a; border-radius: 14px;
      padding: 14px;
    }
    label { display:block; font-size: 12px; opacity: .85; margin: 10px 0 6px; }
    input, select {
      width: 100%; box-sizing: border-box;
      background: #0f1320; border: 1px solid #2a3147; color: #e7e7e7;
      border-radius: 10px; padding: 10px 10px; font-size: 14px;
      outline: none;
    }
    input[type="file"] { padding: 8px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btns { display:flex; gap:10px; margin-top: 12px; flex-wrap: wrap; }
    button {
      background: #7c5cff; color: #fff; border: 0;
      border-radius: 12px; padding: 10px 12px; font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background:#25304a; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .note { font-size: 12px; opacity:.8; margin-top: 10px; line-height: 1.35; }
    .canvWrap { display:grid; gap: 12px; }
    canvas { width: 100%; height: auto; background:#0b0d12; border-radius: 14px; border: 1px solid #242a3a; }
    .smallTitle { font-size: 12px; opacity:.8; margin: 2px 0 8px; }
    .tog { display:flex; gap:10px; align-items:center; margin-top: 10px; flex-wrap: wrap;}
    .tog label { margin: 0; display:flex; gap:8px; align-items:center; }
    .tog input { width:auto; }
    .pillHint { font-size: 12px; opacity:.75; margin-top: 6px; }
    @media (max-width: 980px){
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">

      <div class="card">
        <h3 style="margin:0 0 8px;">Hero Generator</h3>
        <div class="note" style="margin-top:0;">
          Upload a photo, type your text, click <b>Render</b>, then <b>Download JPG</b>.
          Output is 1920×1080 and safe for FB’s square crop (center 1080×1080).
        </div>

        <label>Photo (any size, best if 1920×1080)</label>
        <input id="file" type="file" accept="image/*" />

        <label>Status (pill)</label>
        <input id="status" type="text" value="борлуулах" />

        <label>Title</label>
        <input id="title" type="text" value="Agharta" />

        <div class="row">
          <div>
            <label>Rooms text</label>
            <input id="rooms" type="text" value="5 ӨРӨӨ" />
          </div>
          <div>
            <label>Area text</label>
            <input id="area" type="text" value="154м²" />
          </div>
        </div>

        <label>Style</label>
        <select id="style">
          <option value="darkPill">Dark pill + white title + bottom fade</option>
          <option value="brandPill">Brand pill (purple) + white title + bottom fade</option>
        </select>

        <div class="row">
          <div>
            <label>Bottom fade strength</label>
            <input id="fade" type="number" min="0" max="100" value="82" />
          </div>
          <div>
            <label>JPG Quality (0.6–1.0)</label>
            <input id="q" type="number" min="0.6" max="1" step="0.05" value="0.92" />
          </div>
        </div>

        <div class="tog">
          <label><input id="guides" type="checkbox" checked> Show safe-zone guides</label>
          <label><input id="cropPrev" type="checkbox" checked> Show 1080×1080 preview</label>
        </div>

        <div class="btns">
          <button id="renderBtn" disabled>Render</button>
          <button id="dlBtn" class="secondary" disabled>Download JPG</button>
          <button id="resetBtn" class="secondary">Reset</button>
        </div>

        <div class="pillHint">
          Pill auto-sizes for Mongolian descenders (б/у/л). You don’t manually resize anything.
        </div>
      </div>

      <div class="canvWrap">
        <div class="card">
          <div class="smallTitle">1920×1080 output</div>
          <canvas id="out" width="1920" height="1080"></canvas>
        </div>

        <div class="card" id="cropCard">
          <div class="smallTitle">Facebook grid preview (center-crop 1080×1080)</div>
          <canvas id="crop" width="1080" height="1080"></canvas>
        </div>
      </div>

    </div>
  </div>

<script>
(() => {
  // --- constants
  const W = 1920, H = 1080;
  const SAFE_LEFT = 420, SAFE_RIGHT = 1500; // center 1080px slice
  const SAFE_W = 1080;

  // --- DOM
  const fileEl = document.getElementById('file');
  const statusEl = document.getElementById('status');
  const titleEl  = document.getElementById('title');
  const roomsEl  = document.getElementById('rooms');
  const areaEl   = document.getElementById('area');
  const styleEl  = document.getElementById('style');
  const fadeEl   = document.getElementById('fade');
  const qEl      = document.getElementById('q');
  const guidesEl = document.getElementById('guides');
  const cropPrevEl = document.getElementById('cropPrev');

  const renderBtn = document.getElementById('renderBtn');
  const dlBtn     = document.getElementById('dlBtn');
  const resetBtn  = document.getElementById('resetBtn');

  const out = document.getElementById('out');
  const crop = document.getElementById('crop');
  const cropCard = document.getElementById('cropCard');
  const ctx = out.getContext('2d');
  const cctx = crop.getContext('2d');

  let img = null;
  let lastRenderedBlobUrl = null;

  // Ensure Inter is ready before first render
  async function ensureFontsReady() {
    try { await document.fonts.ready; } catch (_) {}
  }

  // Fit cover draw: fills canvas while preserving aspect ratio
  function drawImageCover(ctx, img, dx, dy, dw, dh) {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const ir = iw / ih;
    const dr = dw / dh;
    let sx=0, sy=0, sw=iw, sh=ih;

    if (ir > dr) {
      // image wider: crop sides
      sh = ih;
      sw = ih * dr;
      sx = (iw - sw) / 2;
      sy = 0;
    } else {
      // image taller: crop top/bottom
      sw = iw;
      sh = iw / dr;
      sx = 0;
      sy = (ih - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  }

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  // Draw rounded rectangle
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function render() {
    if (!img) return;
    const status = (statusEl.value || "").trim();
    const title  = (titleEl.value || "").trim();
    const rooms  = (roomsEl.value || "").trim();
    const areaT  = (areaEl.value || "").trim();
    const style  = styleEl.value;
    const fadeStrength = clamp(parseInt(fadeEl.value || "82", 10), 0, 100);

    // Reset
    ctx.clearRect(0,0,W,H);

    // Background photo
    drawImageCover(ctx, img, 0, 0, W, H);

    // Slight global softening to improve text readability (optional but subtle)
    // Keep it very light.
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    ctx.fillRect(0,0,W,H);
    ctx.restore();

    // --- STATUS PILL (auto size based on text metrics)
    // Place centered within safe zone, near top
    const pillFontSize = 54;              // tuned for 1920x1080
    const pillPadX = 34;
    const pillPadY = 18;                  // enough for Mongolian descenders
    const pillRadius = 26;

    ctx.save();
    ctx.font = `700 ${pillFontSize}px Inter, sans-serif`;
    ctx.textBaseline = "alphabetic";

    // Use actual bounding boxes when available to avoid clipping descenders
    const m = ctx.measureText(status || " ");
    const ascent = (m.actualBoundingBoxAscent ?? pillFontSize * 0.8);
    const descent = (m.actualBoundingBoxDescent ?? pillFontSize * 0.2);
    const textH = ascent + descent;

    const pillW = Math.ceil(m.width + pillPadX * 2);
    const pillH = Math.ceil(textH + pillPadY * 2);

    const safeCenterX = SAFE_LEFT + SAFE_W/2;
    const pillX = Math.round(safeCenterX - pillW/2);
    const pillY = 34; // top margin

    // Pill background
    let pillBg = "rgba(20,20,22,0.92)";
    if (style === "brandPill") pillBg = "rgba(124,92,255,0.92)";
    ctx.fillStyle = pillBg;
    roundRect(ctx, pillX, pillY, pillW, pillH, pillRadius);
    ctx.fill();

    // Pill text (centered using ascent/descent)
    ctx.fillStyle = "#ffffff";
    const textX = Math.round(safeCenterX - m.width/2);
    const baselineY = Math.round(pillY + pillPadY + ascent);
    ctx.fillText(status, textX, baselineY);
    ctx.restore();

    // --- TITLE
    // White title with subtle stroke + shadow (like your template)
    ctx.save();
    const titleSize = 140;
    ctx.font = `800 ${titleSize}px Inter, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    const titleM = ctx.measureText(title || " ");
    const titleAscent = (titleM.actualBoundingBoxAscent ?? titleSize * 0.8);
    const titleX = safeCenterX;

    // Position title below pill
    const titleY = Math.round(pillY + pillH + 150);

    // Shadow
    ctx.shadowColor = "rgba(0,0,0,0.28)";
    ctx.shadowBlur = 10;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 6;

    // Stroke
    ctx.lineWidth = 8;
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.strokeText(title, titleX, titleY);

    // Fill
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(title, titleX, titleY);

    ctx.restore();

    // --- BOTTOM FADE (white gradient)
    // A vertical gradient from transparent to white with controllable strength
    ctx.save();
    const fadeTop = Math.round(H * 0.62); // where fade begins
    const g = ctx.createLinearGradient(0, fadeTop, 0, H);
    const alpha = fadeStrength / 100;
    g.addColorStop(0.0, `rgba(255,255,255,0)`);
    g.addColorStop(1.0, `rgba(255,255,255,${alpha})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, fadeTop, W, H - fadeTop);
    ctx.restore();

    // --- SPECS TEXT
    // Dark charcoal, bold, centered in safe zone near bottom
    ctx.save();
    const specsSize = 96;
    ctx.font = `800 ${specsSize}px Inter, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#1f1f1f";

    const specs = `${rooms}  |  ${areaT}`;
    const specsM = ctx.measureText(specs);
    const specsAscent = (specsM.actualBoundingBoxAscent ?? specsSize * 0.8);

    const specsY = Math.round(H - 110); // bottom margin
    // Tiny shadow for clarity (very subtle)
    ctx.shadowColor = "rgba(255,255,255,0.15)";
    ctx.shadowBlur = 0;
    ctx.fillText(specs, safeCenterX, specsY);
    ctx.restore();

    // --- SAFE ZONE GUIDES
    if (guidesEl.checked) {
      ctx.save();
      ctx.strokeStyle = "rgba(0,255,255,0.65)";
      ctx.lineWidth = 3;
      // left and right guides
      ctx.beginPath();
      ctx.moveTo(SAFE_LEFT, 0); ctx.lineTo(SAFE_LEFT, H);
      ctx.moveTo(SAFE_RIGHT, 0); ctx.lineTo(SAFE_RIGHT, H);
      ctx.stroke();

      // (optional) show the square boundary lightly
      ctx.strokeStyle = "rgba(0,255,255,0.20)";
      ctx.lineWidth = 2;
      ctx.strokeRect(SAFE_LEFT, 0, SAFE_W, H);
      ctx.restore();
    }

    // --- 1080x1080 PREVIEW (what FB grid crop will show)
    cropCard.style.display = cropPrevEl.checked ? "block" : "none";
    if (cropPrevEl.checked) {
      cctx.clearRect(0,0,1080,1080);
      // crop from center slice of the 1920x1080 canvas (420..1500)
      cctx.drawImage(out, SAFE_LEFT, 0, 1080, 1080, 0, 0, 1080, 1080);
    }

    dlBtn.disabled = false;
  }

  function downloadJpg() {
    const q = clamp(parseFloat(qEl.value || "0.92"), 0.6, 1.0);
    out.toBlob((blob) => {
      if (!blob) return;
      if (lastRenderedBlobUrl) URL.revokeObjectURL(lastRenderedBlobUrl);
      lastRenderedBlobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = lastRenderedBlobUrl;
      a.download = `hero_1920x1080.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, "image/jpeg", q);
  }

  function resetAll() {
    statusEl.value = "борлуулах";
    titleEl.value  = "Agharta";
    roomsEl.value  = "5 ӨРӨӨ";
    areaEl.value   = "154м²";
    styleEl.value  = "darkPill";
    fadeEl.value   = "82";
    qEl.value      = "0.92";
    guidesEl.checked = true;
    cropPrevEl.checked = true;
    img = null;
    ctx.clearRect(0,0,W,H);
    cctx.clearRect(0,0,1080,1080);
    renderBtn.disabled = true;
    dlBtn.disabled = true;
    fileEl.value = "";
  }

  // events
  fileEl.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    await ensureFontsReady();
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      img = im;
      renderBtn.disabled = false;
      dlBtn.disabled = true;
      render();
      URL.revokeObjectURL(url);
    };
    im.onerror = () => {
      alert("Could not load image.");
      URL.revokeObjectURL(url);
    };
    im.src = url;
  });

  renderBtn.addEventListener('click', async () => {
    await ensureFontsReady();
    render();
  });

  dlBtn.addEventListener('click', downloadJpg);

  resetBtn.addEventListener('click', resetAll);

  // Live re-render on input changes (when image is loaded)
  const liveInputs = [statusEl, titleEl, roomsEl, areaEl, styleEl, fadeEl, guidesEl, cropPrevEl];
  for (const el of liveInputs) {
    el.addEventListener('input', () => { if (img) render(); });
    el.addEventListener('change', () => { if (img) render(); });
  }

  // Initial
  resetAll();
})();
</script>
</body>
</html>
