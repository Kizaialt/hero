<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Олноор лого оруулагч</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:#0f1115;
  color:#eaeef4;
}

.wrap { max-width:1100px; margin:28px auto; padding:0 16px; }
.grid { display:grid; grid-template-columns:360px 1fr; gap:16px; }
@media (max-width:980px){ .grid{ grid-template-columns:1fr; } }

.card {
  background:#141826;
  border:1px solid #222940;
  border-radius:14px;
  padding:16px;
}

h1 { margin:0 0 10px; font-size:22px; }
h2 { margin:0 0 10px; font-size:16px; opacity:.9; }

label { display:block; margin:10px 0 6px; font-size:12px; opacity:.9; }

input[type="file"],
select,
input[type="number"],
input[type="range"] {
  width:100%;
  padding:10px;
  background:#0f1320;
  border:1px solid #2a3147;
  color:#eaeef4;
  border-radius:10px;
  outline:none;
}

.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.btns {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

button {
  background:#7c5cff;
  color:#fff;
  border:0;
  padding:10px 12px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

button.secondary { background:#2a3350; }
button:disabled { opacity:.55; cursor:not-allowed; }

.note { font-size:12px; opacity:.8; margin-top:8px; line-height:1.35; }

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
  gap:12px;
}

.thumb {
  background:#0b0f1c;
  border:1px solid #222940;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio:1/1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.thumb img { max-width:100%; max-height:100%; }

.cap {
  position:absolute;
  left:8px;
  bottom:8px;
  font-size:11px;
  background:rgba(0,0,0,.45);
  padding:5px 8px;
  border-radius:8px;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="grid">

    <div class="card">
      <h1>Олноор лого оруулах</h1>

      <label>Зураг оруулах</label>
      <input id="photos" type="file" accept="image/*" multiple />

      <label>Лого сонгох</label>
      <select id="wmPick"></select>
      <div id="wmStatus" class="note">Лого уншиж байна…</div>

      <div class="row">
        <div>
          <label>Байрлал</label>
          <select id="pos">
            <option value="bottom-center">Доод | Голд</option>
            <option value="bottom-right">Доод | Баруун</option>
            <option value="bottom-left">Доод | Зүүн</option>
            <option value="top-right">Дээд | Баруун</option>
            <option value="top-left">Дээд | Зүүн</option>
            <option value="center">Голд | Голд</option>
            <option value="tiled">Tiled</option>
          </select>
        </div>
        <div>
          <label>Хэмжээ (Өргөний %-иар)</label>
          <input id="scale" type="number" value="15" min="2" max="80" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Хэр Тод</label>
          <div style="display:flex;align-items:center;gap:10px;">
            <input id="opacity" type="range" value="100" min="0" max="100" />
            <span id="opacityVal" style="min-width:40px;font-size:12px;">100%</span>
          </div>
        </div>
        <div>
          <label>Зай (px)</label>
          <input id="pad" type="number" value="50" />
        </div>
      </div>

      <div class="btns">
        <button id="previewBtn" class="secondary" disabled>Урьдчилж харах</button>
        <button id="processBtn" disabled>Бүгдийг татаж авах</button>
        <button id="clearBtn" class="secondary">Цэвэрлэх</button>
      </div>
    </div>

    <div class="card">
      <h2>Preview</h2>
      <div id="gallery" class="gallery"></div>
      <div id="status" class="note"></div>
    </div>

  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);

/* 🔴 REPLACE THESE 🔴 */
const WATERMARKS = [
  { id: "wm1", name: "Цагаан", url: "https://kizaialt.github.io/hero/wepro.png" },
  { id: "wm2", name: "Шар",           url: "https://kizaialt.github.io/hero/wepro2.png" },
  { id: "wm3", name: "Бүтэн Шар",           url: "https://kizaialt.github.io/hero/wepro3.png" },
 ];

const photosEl = $('#photos');
const wmPick = $('#wmPick');
const wmStatus = $('#wmStatus');
const posEl = $('#pos');
const scaleEl = $('#scale');
const opacityEl = $('#opacity');
const opacityVal = $('#opacityVal');
const padEl = $('#pad');
const previewBtn = $('#previewBtn');
const processBtn = $('#processBtn');
const clearBtn = $('#clearBtn');
const gallery = $('#gallery');
const statusEl = $('#status');

let photoFiles = [];
let watermarkCache = new Map();
let activeWM = WATERMARKS[0].id;

opacityVal.textContent = opacityEl.value + '%';
opacityEl.addEventListener('input', () => {
  opacityVal.textContent = opacityEl.value + '%';
});

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function fileToImage(f){
  return new Promise(res=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.src=URL.createObjectURL(f);
  });
}

function place(pos,W,H,wW,wH,p){
  const m={
    "bottom-center":[(W-wW)/2,H-wH-p],
    "bottom-right":[W-wW-p,H-wH-p],
    "bottom-left":[p,H-wH-p],
    "top-right":[W-wW-p,p],
    "top-left":[p,p],
    "center":[(W-wW)/2,(H-wH)/2]
  };
  return m[pos]||m["bottom-center"];
}

async function renderOne(img,wm){
  const W=img.width,H=img.height;
  const c=document.createElement('canvas');
  c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,W,H);

  const wW=W*(scaleEl.value/100);
  const wH=wW*(wm.height/wm.width);
  const [x,y]=place(posEl.value,W,H,wW,wH,Number(padEl.value));

  ctx.globalAlpha=opacityEl.value/100;
  ctx.drawImage(wm,x,y,wW,wH);

  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.92));
}

function showThumb(name,blob){
  const d=document.createElement('div');
  d.className="thumb";
  const i=new Image();
  i.src=URL.createObjectURL(blob);
  const c=document.createElement('div');
  c.className="cap"; c.textContent=name;
  d.append(i,c);
  gallery.appendChild(d);
}

async function preview(){
  gallery.innerHTML="";
  const img=await fileToImage(photoFiles[0]);
  const wm=watermarkCache.get(activeWM);
  const blob=await renderOne(img,wm);
  showThumb("PREVIEW",blob);
}

async function processAll(){
  gallery.innerHTML="";
  statusEl.textContent="Processing & downloading…";
  for(const f of photoFiles){
    const img=await fileToImage(f);
    const blob=await renderOne(img,watermarkCache.get(activeWM));
    const name=f.name.replace(/\.\w+$/,'')+"_wm.jpg";
    downloadBlob(blob,name);
    showThumb(name,blob);
    await new Promise(r=>setTimeout(r,120));
  }
  statusEl.textContent="Done.";
}

function loadWM(id){
  const w=WATERMARKS.find(x=>x.id===id);
  if(watermarkCache.has(id)){
    wmStatus.textContent="Сонгосон "+w.name;
    return;
  }
  const i=new Image();
  i.crossOrigin="anonymous";
  i.onload=()=>{
    watermarkCache.set(id,i);
    wmStatus.textContent="Сонгосон "+w.name;
    previewBtn.disabled=processBtn.disabled=!photoFiles.length;
  };
  i.src=w.url;
}

wmPick.innerHTML=WATERMARKS.map(w=>`<option value="${w.id}">${w.name}</option>`).join("");
loadWM(activeWM);

photosEl.onchange=e=>{
  photoFiles=[...e.target.files];
  previewBtn.disabled=processBtn.disabled=!photoFiles.length;
};

wmPick.onchange=e=>{ activeWM=e.target.value; loadWM(activeWM); };
previewBtn.onclick=preview;
processBtn.onclick=processAll;
clearBtn.onclick=()=>{ gallery.innerHTML=""; photosEl.value=""; };

})();
</script>
</body>
</html>
